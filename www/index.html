<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Inversiones Fajio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Encabezado Superior Figma: Inversiones Fajio -->
        <header class="fajio-header">
            <div class="fajio-title">Inversiones Fajio</div>

            <!-- Fila 1: Pestañas Principales (Calculo | Onza (Kitco) | Dolar (bloomberg)) -->
            <nav class="fajio-top-tabs">
                <button class="top-tab-btn active" id="btn-top-calculo" onclick="switchTopTab('CALCULO')">Calculo</button>
                <button class="top-tab-btn" id="btn-top-onza" onclick="switchTopTab('ONZA')">Onza (Kitco)</button>
                <button class="top-tab-btn" id="btn-top-dolar" onclick="switchTopTab('DOLAR')">Dolar (bloomberg)</button>
            </nav>

            <!-- Fila 2: Sub-pestañas (Registro | Promedio | Registro Acumulado | Préstamos) -->
            <nav class="fajio-subtabs" id="layout-subtabs">
                <button class="subtab-btn active" id="btn-sub-registro" onclick="switchSubTab('REGISTRO')">Registro</button>
                <button class="subtab-btn" id="btn-sub-promedio" onclick="switchSubTab('PROMEDIO')">Promedio</button>
                <button class="subtab-btn" id="btn-sub-acumulado" onclick="switchSubTab('ACUMULADO')">Registro Acumulado</button>
                <button class="subtab-btn" id="btn-sub-prestamos" onclick="switchSubTab('PRESTAMOS')">Préstamos</button>
            </nav>
        </header>

        <!-- Contenedor Principal de Pantallas -->
        <main class="content-container">

            <!-- PANTALLA: REGISTRO -->
            <section id="view-registro" class="view-section active">
                <div class="action-row">
                    <input type="text" class="search-input" id="search-registro" placeholder="🔍 Buscar cliente..." oninput="renderRegistros()">
                    <button class="btn-fajio-add" onclick="openFormModal()">➕ Nuevo Cálculo</button>
                </div>
                <div id="list-registros">
                    <!-- Registros dinámicos -->
                </div>
            </section>

            <!-- PANTALLA: PROMEDIO -->
            <section id="view-promedio" class="view-section">
                <div class="action-row">
                    <input type="text" class="search-input" id="search-promedio-cliente" placeholder="👤 Buscar cliente..." oninput="renderPromedios()">
                </div>
                <div id="container-promedios">
                    <!-- Promedios dinámicos -->
                </div>
            </section>

            <!-- PANTALLA: REGISTRO ACUMULADO -->
            <section id="view-acumulado" class="view-section">
                <div class="fajio-card" style="border-color: var(--fajio-gold-label);">
                    <div class="fajio-label-gold">TOTAL REGISTRO ACUMULADO</div>
                    <div class="final-pay-amount" id="tv-acumulado-total">S/ 0.00</div>
                    <div class="fajio-row-2" style="margin-top: 8px;">
                        <div class="fajio-col-2">Peso: <strong id="tv-acumulado-peso" style="color: #FFFFFF;">0.00 g</strong></div>
                        <div class="fajio-col-2">Merma: <strong id="tv-acumulado-merma" style="color: #FFFFFF;">0.00 g</strong></div>
                    </div>
                </div>
                <div id="list-acumulado"></div>
            </section>

            <!-- PANTALLA: PRÉSTAMOS -->
            <section id="view-prestamos" class="view-section">
                <div class="action-row">
                    <input type="text" class="search-input" id="search-prestamo" placeholder="🔍 Buscar préstamo..." oninput="renderPrestamos()">
                    <button class="btn-fajio-add" onclick="openPrestamoModal()">➕ Nuevo Préstamo</button>
                </div>
                <div id="list-prestamos"></div>
            </section>

            <!-- PANTALLA: ONZA (KITCO) -->
            <section id="view-onza" class="view-section">
                <div class="fajio-card">
                    <div class="fajio-client-name" style="margin-bottom: 16px;">⚡ Cotización Onza (Kitco)</div>
                    <div class="fajio-row-2">
                        <div class="fajio-col-2 fajio-field-group">
                            <label class="fajio-label-gold">ONZA (USD)</label>
                            <div class="fajio-input-box">
                                <input type="number" id="quick-onza" value="2650.00" step="0.01" oninput="calculateQuickGold()">
                            </div>
                        </div>
                        <div class="fajio-col-2 fajio-field-group">
                            <label class="fajio-label-gold">LEY %</label>
                            <div class="fajio-input-box">
                                <input type="number" id="quick-ley" value="90.0" step="0.1" oninput="calculateQuickGold()">
                            </div>
                        </div>
                    </div>
                    <div class="fajio-row-2">
                        <div class="fajio-col-2 fajio-field-group">
                            <label class="fajio-label-gold">DESC. %</label>
                            <div class="fajio-input-box">
                                <input type="number" id="quick-desc" value="1.5" step="0.1" oninput="calculateQuickGold()">
                            </div>
                        </div>
                        <div class="fajio-col-2 fajio-field-group">
                            <label class="fajio-label-gold">T.C.</label>
                            <div class="fajio-input-box">
                                <input type="number" id="quick-tc" value="3.78" step="0.01" oninput="calculateQuickGold()">
                            </div>
                        </div>
                    </div>
                    <div class="final-pay-box" style="margin-bottom: 0;">
                        <div class="fajio-label-gold">PRECIO POR GRAMO</div>
                        <div class="final-pay-amount" id="res-gold-soles">S/ 0.00</div>
                    </div>
                </div>
            </section>

            <!-- PANTALLA: DÓLAR (BLOOMBERG) -->
            <section id="view-dolar" class="view-section">
                <div class="fajio-card">
                    <div class="fajio-client-name" style="margin-bottom: 16px;">💵 Dólar (Bloomberg)</div>
                    <div class="fajio-row-2">
                        <div class="fajio-col-2 fajio-field-group">
                            <label class="fajio-label-gold">MONTO USD ($)</label>
                            <div class="fajio-input-box">
                                <input type="number" id="calc-usd-monto" value="100.00" step="1" oninput="calculateQuickDollar()">
                            </div>
                        </div>
                        <div class="fajio-col-2 fajio-field-group">
                            <label class="fajio-label-gold">T.C.</label>
                            <div class="fajio-input-box">
                                <input type="number" id="calc-tc-val" value="3.78" step="0.01" oninput="calculateQuickDollar()">
                            </div>
                        </div>
                    </div>
                    <div class="final-pay-box" style="margin-bottom: 0;">
                        <div class="fajio-label-gold">TOTAL SOLES</div>
                        <div class="final-pay-amount" id="res-dolar-soles">S/ 378.00</div>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL FORMULARIO INVERSIONES FAJIO -->
    <div id="modal-form" class="modal-overlay">
        <div class="modal-content-scroll">
            <div style="text-align: right;">
                <button style="background:none; border:none; color:#FFF; font-size:20px; cursor:pointer;" onclick="closeFormModal()">✕</button>
            </div>
            
            <div class="badge-logo">⚖️</div>
            <div class="modal-title-main">Inversiones Fajio</div>
            <div class="modal-subtitle-gold">Cálculo y Recepción de Oro</div>

            <div class="divider-line"></div>

            <!-- TARJETA CLIENTE -->
            <div class="fajio-field-group">
                <label class="fajio-label-gold">NOMBRE COMPLETO DEL CLIENTE</label>
                <div class="fajio-input-box">
                    <input type="text" id="form-cliente" placeholder="Ingrese el nombre" value="X">
                </div>
            </div>

            <!-- FILA ONZA / LEY -->
            <div class="fajio-row-2">
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">ONZA</label>
                    <div class="fajio-input-box">
                        <input type="number" id="form-onza" placeholder="4000" step="0.01">
                    </div>
                </div>
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">LEY</label>
                    <div class="fajio-input-box">
                        <input type="number" id="form-ley-gen" placeholder="95.95" step="0.1">
                    </div>
                </div>
            </div>

            <!-- FILA PORCENTAJE % / T.C. -->
            <div class="fajio-row-2">
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">PORCENTAJE %</label>
                    <div class="fajio-input-box">
                        <span class="fajio-input-prefix">%</span>
                        <input type="number" id="form-porcentaje" placeholder="9.5" step="0.1">
                    </div>
                </div>
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">T.C.</label>
                    <div class="fajio-input-box">
                        <input type="number" id="form-tc" placeholder="3.36" step="0.01">
                    </div>
                </div>
            </div>

            <!-- FILA PRECIO USD / PRECIO SOLES -->
            <div class="fajio-row-2">
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">PRECIO USD</label>
                    <div class="fajio-input-box">
                        <span class="fajio-input-prefix">$</span>
                        <input type="number" id="form-precio-usd" placeholder="111.67" readonly style="opacity: 0.8;">
                    </div>
                </div>
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">PRECIO SOLES</label>
                    <div class="fajio-input-box">
                        <span class="fajio-input-prefix">S/</span>
                        <input type="number" id="form-precio-soles" placeholder="375.21" readonly style="opacity: 0.8;">
                    </div>
                </div>
            </div>

            <!-- SECCIÓN DE MATERIALES -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px 0;">
                <span style="color: var(--fajio-blue-glow); font-size: 13px; font-weight: bold;">PESOS DE MATERIALES</span>
                <button style="background: var(--fajio-gold-label); color: #FFF; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;" onclick="addMaterialCard()">➕ Añadir Material</button>
            </div>

            <div id="container-materials"></div>

            <!-- DESCUENTO -->
            <div class="fajio-row-2">
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">MOTIVO DESCUENTO</label>
                    <div class="fajio-input-box">
                        <input type="text" id="form-desc-motivo" placeholder="Descripción">
                    </div>
                </div>
                <div class="fajio-col-2 fajio-field-group">
                    <label class="fajio-label-gold">MONTO DESCUENTO</label>
                    <div class="fajio-input-box">
                        <span class="fajio-input-prefix">-</span>
                        <input type="number" id="form-desc-monto" placeholder="0.00" step="0.1">
                    </div>
                </div>
            </div>

            <!-- PAGO TOTAL FINAL -->
            <div class="final-pay-box">
                <div class="final-pay-title">PAGO TOTAL FINAL</div>
                <div class="final-pay-amount" id="form-pago-total">S/ 0.00</div>
            </div>

            <!-- BOTÓN GUARDAR LOTE -->
            <button class="btn-save-main" onclick="saveFormCalculo()">💾 Guardar Lote de Materiales</button>
        </div>
    </div>

    <!-- MODAL PRÉSTAMO -->
    <div id="modal-prestamo" class="modal-overlay">
        <div class="modal-content-scroll" style="max-width: 380px;">
            <div style="text-align: right;">
                <button style="background:none; border:none; color:#FFF; font-size:20px; cursor:pointer;" onclick="closePrestamoModal()">✕</button>
            </div>
            <div class="modal-title-main" style="font-size: 20px;">Nuevo Préstamo</div>
            <div class="divider-line"></div>
            <div class="fajio-field-group">
                <label class="fajio-label-gold">CLIENTE</label>
                <div class="fajio-input-box">
                    <input type="text" id="p-cliente" placeholder="Nombre del cliente">
                </div>
            </div>
            <div class="fajio-field-group">
                <label class="fajio-label-gold">MONTO PRESTADO (S/)</label>
                <div class="fajio-input-box">
                    <input type="number" id="p-monto" placeholder="0.00" step="0.1">
                </div>
            </div>
            <div class="fajio-field-group">
                <label class="fajio-label-gold">DETALLE</label>
                <div class="fajio-input-box">
                    <input type="text" id="p-detalle" placeholder="Nota u observación">
                </div>
            </div>
            <button class="btn-save-main" style="margin-top: 16px;" onclick="savePrestamo()">💾 Guardar Préstamo</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
