plugins {
    id 'com.android.application'
}

android {
    namespace 'com.faicalculer'
    compileSdk 35

    defaultConfig {
        applicationId "com.faicalculer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // AndroidX & AppCompat para componentes visuales y AppCompatActivity
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Google Material Components para el Tema (Theme.MaterialComponents)
    implementation 'com.google.android.material:material:1.11.0'
    
    // Layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Soporte nativo de Impresión de Recibos para impresoras térmicas Advance ADV-8011N
    implementation 'androidx.print:print:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Pruebas unitarias y de instrumentación
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
